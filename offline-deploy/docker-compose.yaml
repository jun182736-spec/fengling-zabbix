services:
  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: ${MYSQL_CONTAINER_NAME:-zabbix-mysql}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.sh to create .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run deploy.sh to create .env first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" --batch --skip-column-names
          -e 'SELECT mandatory FROM dbversion' | grep -qx 7000000
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 60s
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0.30
    pull_policy: never
    container_name: ${SERVER_CONTAINER_NAME:-zabbix-server}
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.sh first}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-10051}:10051"
    healthcheck:
      test: [CMD-SHELL, "nc -z -w 3 127.0.0.1 10051"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - zabbix-net

  zabbix-web:
    image: my-zabbix-web:7.0.30
    pull_policy: never
    container_name: ${WEB_CONTAINER_NAME:-zabbix-web-custom}
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.sh first}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: 风铃云监控管理系统
      PHP_TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 3 http://127.0.0.1:8080/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - zabbix-net

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-zabbix-platform_mysql-data}

networks:
  zabbix-net:
    driver: bridge
